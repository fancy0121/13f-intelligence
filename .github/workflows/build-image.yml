name: 13F offline tests - publishing blocked

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-07
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-07
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run offline regression suite
        run: |
          mkdir -p .pytest_tmp
          python -m pytest -o addopts='' --basetemp=.pytest_tmp/ci -q

      - name: Syntax validation
        run: python -m compileall -q src app scripts

      # Safety containment, NOT the completed release automation.
      # Restore publishing only through the approved validated-bundle pipeline:
      # docs/superpowers/plans/2026-09-05-02-release-automation.md
      - name: Record release hold
        run: echo 'NOT_VALIDATED - no image build, push or deployment. Real data Gates and the validated-bundle pipeline remain required.' >> "$GITHUB_STEP_SUMMARY"
